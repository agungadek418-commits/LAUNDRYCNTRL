    // Markup kartu struk saja (dipakai di dalam .sheet, baik untuk halaman cetak maupun capture gambar)

                <div class="row"><span class="l">${t.waktuSerah}</span><span class="v">${formatDateTimeID(order.createdAt, lang)}</span></div>

    function printOrderReceipt(orderId, lang = 'id') {
        const orders = getOrders();
        const order = orders.find(o => o.id === orderId);
        if (!order) { showToast('Order tidak ditemukan.', 'warn'); return; }

        const html = receiptHtmlDocument(order, lang);
        const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const w = window.open(url, '_blank');
        if (!w) {
            showToast('Popup diblokir browser. Izinkan popup untuk mencetak struk.', 'warn');
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    function buildReceiptWaText(order, lang = 'id') {
        const f = buildReceiptFields(order, lang);
        const t = f.t;
        let msg = `${t.waTitle}\n`
            + `Hotel Laundry - Smart Laundry Management\n\n`
            + `${t.waIdOrder}: *${order.id}*\n`
            + `${t.kamar}: ${order.room}\n`
            + `${t.namaTamu}: ${order.guestName}\n`
            + `${t.waktuSerah}: ${formatDateTimeID(order.createdAt, lang)}\n`
            + `${t.layanan}: ${f.serviceLabel} (${formatRp(f.rate)}/${t.kg})\n`
            + `${t.jumlahPakaian}: ${order.totalPakaian ? order.totalPakaian + ' ' + t.pcs : '-'}\n`
            + `${t.berat}: ${f.weighed ? formatWeightDisplay(order.weightKg) + ' ' + t.kg : t.beratMenyusul}\n`;

        if (f.weighed) msg += `${t.estimasiBiaya}: ${formatRp(f.totalPrice)}\n`;
        if (order.guestRequest) msg += `${t.waCatatan}: ${order.guestRequest}\n`;

        msg += `\n⏱️ *${t.estimasiSelesai}:* ${f.estimateText}\n\n` + t.waFooter(order.id);

        return msg;
    }

    // ==========================================
    // FOTO STRUK (html2canvas, di-load on-demand)
    // ==========================================
    function loadHtml2Canvas() {
        if (window.html2canvas) return Promise.resolve();
        if (window.__html2canvasLoading) return window.__html2canvasLoading;
        window.__html2canvasLoading = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            s.onload = () => resolve();
            s.onerror = () => reject(new Error('Gagal memuat library gambar.'));
            document.head.appendChild(s);
        });
        return window.__html2canvasLoading;
    }

    function ensureReceiptStylesInjected() {
        if (document.getElementById('receiptCardStyles')) return;
        const style = document.createElement('style');
        style.id = 'receiptCardStyles';
        style.textContent = RECEIPT_CSS;
        document.head.appendChild(style);
    }

    // Render struk tersembunyi di halaman lalu tangkap jadi gambar PNG (Blob)
    async function captureReceiptImage(order, lang = 'id') {
        await loadHtml2Canvas();
        ensureReceiptStylesInjected();

        const wrapper = document.createElement('div');
        wrapper.className = 'receipt-scope';
        wrapper.style.cssText = 'position:fixed; left:-9999px; top:0; width:420px; background:#ffffff;';
        wrapper.innerHTML = buildReceiptCardHtml(order, lang);
        document.body.appendChild(wrapper);

        // beri waktu font-awesome & font render dulu sebelum di-capture
        await new Promise(r => setTimeout(r, 120));

        try {
            const target = wrapper.querySelector('.receipt');
            const canvas = await html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
            return await new Promise(resolve => canvas.toBlob(blob => resolve(blob), 'image/png'));
        } finally {
            document.body.removeChild(wrapper);
        }
    }

    async function sendReceiptToWhatsApp(orderId, lang = 'id') {
        const orders = getOrders();
        const order = orders.find(o => o.id === orderId);
        if (!order) { showToast('Order tidak ditemukan.', 'warn'); return; }

        const message = buildReceiptWaText(order, lang);
        const waPhone = formatPhoneForWa(order.guestPhone);
        const textUrl = waPhone
            ? `https://wa.me/${waPhone}?text=${encodeURIComponent(message)}`
            : `https://wa.me/?text=${encodeURIComponent(message)}`;

        showToast('Menyiapkan foto struk...', 'info');

        let imageBlob = null;
        try {
            imageBlob = await captureReceiptImage(order, lang);
        } catch (err) {
            imageBlob = null;
        }

        if (!imageBlob) {
            showToast('Gagal membuat foto struk, mengirim versi teks saja.', 'warn');
            window.open(textUrl, '_blank');
            return;
        }

        const file = new File([imageBlob], `struk-${order.id}.png`, { type: 'image/png' });

        // Jalur utama di HP: share langsung sebagai foto ke aplikasi WhatsApp
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(message).catch(() => {});
            }
            showToast('Teks struk sudah disalin. Setelah pilih WhatsApp, tempel (paste) di kolom pesan sebelum kirim.', 'info');
            try {
                await navigator.share({ files: [file], text: message });
                return;
            } catch (err) {
                // dibatalkan pengguna atau gagal share -> lanjut ke fallback download di bawah
            }
        }

        // Fallback (umumnya di desktop): unduh foto struknya, lalu buka chat WA
        // supaya tinggal lampirkan (attach) foto yang baru diunduh.
        const url = URL.createObjectURL(imageBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `struk-${order.id}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);

        showToast('Foto struk sudah diunduh. Lampirkan (attach) file tersebut di chat WhatsApp yang baru dibuka.', 'success');
        window.open(textUrl, '_blank');
    }

    // ==========================================
    // DETEKSI ORDER "NYANGKUT" (stuck) DI SATU STATUS TERLALU LAMA
    // ==========================================
    const STUCK_THRESHOLD_HOURS = 6; // ubah di sini kalau mau batas selain 6 jam

    // Order lama (sebelum fitur ini ada) belum punya statusSince -> pakai createdAt sebagai fallback
    function getStatusSince(order) {
        return order.statusSince || order.createdAt;
    }

    function stuckHours(order) {
        const since = getStatusSince(order);
        if (!since) return 0;
        return (Date.now() - new Date(since).getTime()) / 3600000;
    }

    // Hanya order aktif (belum Delivered) yang bisa dianggap "nyangkut"
    function isOrderStuck(order) {
        if (!order || order.status === 'Delivered') return false;
        return stuckHours(order) >= STUCK_THRESHOLD_HOURS;
    }

    function stuckBadgeHtml(order, extraClass = '') {
        if (!isOrderStuck(order)) return '';
        const h = Math.floor(stuckHours(order));
        return `
            <span class="stuck-badge ${extraClass}" title="Sudah ${h} jam di status ${order.status}, cek segera">
                <i class="fa-solid fa-triangle-exclamation"></i> ${h}j di ${order.status}
            </span>`;
    }

    function timeAgo(value) {
        const m = Math.floor((Date.now() - new Date(value).getTime()) / 60000);
        if (m < 1) return 'Baru saja';
        if (m < 60) return m + ' mnt lalu';
        const h = Math.floor(m / 60);
        if (h < 24) return h + ' jam lalu';
        return Math.floor(h / 24) + ' hari lalu';
    }

                            <span class="w-2 h-2 rounded-full" style="background:${t.color}"></span>${t.label}
                            <span class="${activeStatusFilter === t.id ? 'text-white/70' : 'text-slate-400'}">${t.n}</span>

                    `).join('')}
                </div>

                ${list.length === 0 ? `
                    <div class="bg-white/80 rounded-3xl p-10 text-center border border-dashed border-slate-200">

    }

    let historyFilter = 'All';
    let historySearchQuery = '';
    let historyDateMode = 'all';   // all | today | yesterday | 7d | 30d | custom
    let historyDateFrom = '';      // format YYYY-MM-DD (tanggal lokal)
    let historyDateTo = '';

    const HISTORY_DATE_CHIPS = [
        { id: 'all', label: 'Semua' },
        { id: 'today', label: 'Hari Ini' },
        { id: 'yesterday', label: 'Kemarin' },
        { id: '7d', label: '7 Hari' },
        { id: '30d', label: '30 Hari' },
        { id: 'custom', label: 'Pilih Tanggal' }
    ];

    // ---------- Helper tanggal (selalu memakai zona waktu perangkat) ----------
    function dateKey(value) {
        const d = value instanceof Date ? value : new Date(value);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function shiftDate(date, days) {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
    }

    function keyToDate(key) {
        const [y, m, d] = key.split('-').map(Number);
        return new Date(y, m - 1, d);
    }

    function formatDateLong(key) {
        return keyToDate(key).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatDateShort(key) {
        return keyToDate(key).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function relativeDayLabel(key) {
        const today = new Date();
        if (key === dateKey(today)) return 'Hari Ini';
        if (key === dateKey(shiftDate(today, -1))) return 'Kemarin';
        return '';
    }

    function getHistoryDateRange() {
        const today = new Date();
        switch (historyDateMode) {
            case 'today':     return { from: dateKey(today), to: dateKey(today) };
            case 'yesterday': { const y = dateKey(shiftDate(today, -1)); return { from: y, to: y }; }
            case '7d':        return { from: dateKey(shiftDate(today, -6)), to: dateKey(today) };
            case '30d':       return { from: dateKey(shiftDate(today, -29)), to: dateKey(today) };
            case 'custom': {
                let from = historyDateFrom, to = historyDateTo;
                if (from && to && from > to) [from, to] = [to, from];
                return { from, to };
            }
            default: return null;
        }
    }

    function describeHistoryPeriod() {
        const range = getHistoryDateRange();
        if (!range) return 'Semua tanggal';
        if (historyDateMode === 'today') return 'Hari ini';
        if (historyDateMode === 'yesterday') return 'Kemarin';
        if (!range.from && !range.to) return 'Semua tanggal';
        if (range.from && range.to) return range.from === range.to ? formatDateShort(range.from) : formatDateShort(range.from) + ' – ' + formatDateShort(range.to);
        return range.from ? 'Sejak ' + formatDateShort(range.from) : 'Sampai ' + formatDateShort(range.to);
    }

    // ---------- Aksi filter ----------
    // Render ulang Riwayat tanpa kehilangan posisi scroll / fokus input
    function refreshHistory(focusId) {
        const container = document.getElementById('screen-container');
        const top = container.scrollTop;
        historyAnimate = false;
        navigateTo('history');
        container.scrollTop = top;
        if (focusId) {
            const el = document.getElementById(focusId);
            if (el) {
                el.focus();
                if (el.type === 'text') el.setSelectionRange(el.value.length, el.value.length);
            }
        }
    }

    function setHistoryDateMode(mode) {
        historyDateMode = mode;
        if (mode === 'custom' && !historyDateFrom && !historyDateTo) {
            historyDateFrom = historyDateTo = dateKey(new Date());
        }
        refreshHistory();
    }

    function setHistoryDate(which, value) {
        if (which === 'from') historyDateFrom = value; else historyDateTo = value;
        refreshHistory();
    }

    function resetHistoryFilters() {

    // ---------- Layar Riwayat ----------
    let historyAnimate = true;

    function renderHistoryScreen() {
        const animate = historyAnimate;
        historyAnimate = true;

        const orders = getOrders();
        const range = getHistoryDateRange();
        const query = historySearchQuery.toLowerCase();

        const filtered = orders.filter(o => {
            const matchesSearch = o.room.includes(historySearchQuery) ||
                                  (o.guestName || '').toLowerCase().includes(query) ||
                                  o.id.toLowerCase().includes(query);
            if (!matchesSearch) return false;

            if (range) {
                const k = dateKey(o.createdAt);
                if (range.from && k < range.from) return false;
                if (range.to && k > range.to) return false;
            }

            if (historyFilter === 'All') return true;
            if (historyFilter === 'Regular') return o.service === 'regular';
            if (historyFilter === 'Express') return o.service === 'express';
            if (historyFilter === 'Completed' || historyFilter === 'Delivered') return o.status === 'Delivered';
            return true;
        }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        // Kelompokkan per tanggal laundry
        const groups = {};
        filtered.forEach(o => {
            const k = dateKey(o.createdAt);
            (groups[k] = groups[k] || []).push(o);
        });
        const dayKeys = Object.keys(groups).sort().reverse();

        const sumOf = list => list.reduce((acc, o) => {
            acc.kg += parseFloat(o.weightKg) || 0;
            acc.rp += calculateOrderTotals(o.weightKg, o.service).totalPrice;
            return acc;
        }, { kg: 0, rp: 0 });
        const fmtKg = kg => formatWeightDisplay(Math.round(kg * 10) / 10);
        const total = sumOf(filtered);
        const expressN = filtered.filter(o => o.service === 'express').length;
        const regularN = filtered.length - expressN;

        const hasFilter = historyDateMode !== 'all' || historyFilter !== 'All' || historySearchQuery !== '';

            Ready:      { grad: 'linear-gradient(140deg,#8B5CF6 0%,#C026D3 100%)', color: '#A855F7' },

    function setReportMonth(value) {

    function computeMonthlyReport(monthStr) {
        const orders = getOrders().filter(o => dateKey(o.createdAt).slice(0, 7) === monthStr);
        const monthLabel = keyToDate(monthStr + '-01').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

        const byDay = {};
        let totalRp = 0, totalKg = 0, expressN = 0, regularN = 0;

        orders.forEach(o => {
            const k = dateKey(o.createdAt);
            const { totalPrice } = calculateOrderTotals(o.weightKg, o.service);
            const kg = parseFloat(o.weightKg) || 0;

            if (!byDay[k]) byDay[k] = { count: 0, kg: 0, rp: 0 };
            byDay[k].count += 1;
            byDay[k].kg += kg;
            byDay[k].rp += totalPrice;

            totalRp += totalPrice;
            totalKg += kg;
            if (o.service === 'express') expressN++; else regularN++;
        });

        const dayKeys = Object.keys(byDay).sort((a, b) => b.localeCompare(a));

        return { monthLabel, count: orders.length, totalRp, totalKg, expressN, regularN, byDay, dayKeys, orders };
    }

    }

    function downloadJsonFile(payload, filename) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    function exportBackupData() {
        downloadJsonFile(buildBackupPayload(), `hotel-laundry-backup-${dateKey(new Date())}.json`);
        showToast('Backup data berhasil diunduh.', 'success');
    }

    // ==========================================
    // BACKUP OTOMATIS PADA TANGGAL YANG DITENTUKAN
    // ==========================================
    function getAutoBackupCfg() {
        try {
            return { enabled: false, day: 1, lastRun: '', history: [], ...JSON.parse(localStorage.getItem('hl_autobackup') || '{}') };
        } catch { return { enabled: false, day: 1, lastRun: '', history: [] }; }
    }

    function setAutoBackupCfg(cfg) {
        localStorage.setItem('hl_autobackup', JSON.stringify(cfg));
    }

    // Kalau tanggal yang dipilih tidak ada di bulan ini (misal 31 di bulan Februari),
    // dijalankan di hari terakhir bulan itu saja.
    function effectiveBackupDay(day, refDate = new Date()) {
        const lastDay = new Date(refDate.getFullYear(), refDate.getMonth() + 1, 0).getDate();
        return Math.min(day, lastDay);
    }

    // Simpan cadangan otomatis di localStorage juga (bukan cuma file unduhan),
    // supaya tetap ada walau file unduhannya tidak sengaja terhapus/tidak ketemu.
    function saveAutoBackupSnapshot(cfg, payload) {
        const history = Array.isArray(cfg.history) ? cfg.history : [];
        history.unshift({ at: payload.exportedAt, count: payload.orders.length, payload });
        cfg.history = history.slice(0, 5); // simpan 5 cadangan terakhir saja
        return cfg;
    }

    function checkAutoBackup() {
        const cfg = getAutoBackupCfg();
        if (!cfg.enabled) return;

        const today = new Date();
        const todayKey = dateKey(today);
        if (cfg.lastRun === todayKey) return; // sudah jalan hari ini
        if (today.getDate() !== effectiveBackupDay(cfg.day, today)) return; // belum tanggalnya

        const payload = buildBackupPayload();
        downloadJsonFile(payload, `hotel-laundry-autobackup-${todayKey}.json`);
        const updated = saveAutoBackupSnapshot(cfg, payload);
        updated.lastRun = todayKey;
        setAutoBackupCfg(updated);
        showToast(`Backup otomatis tanggal ${cfg.day} berhasil, file terunduh.`, 'success');
    }

    function setAutoBackupEnabled(enabled) {
        const cfg = getAutoBackupCfg();
        cfg.enabled = enabled;
        setAutoBackupCfg(cfg);
        if (enabled) checkAutoBackup();
        navigateTo('settings');
    }

    function setAutoBackupDay(day) {
        const d = Math.max(1, Math.min(31, parseInt(day, 10) || 1));
        const cfg = getAutoBackupCfg();
        cfg.day = d;
        setAutoBackupCfg(cfg);
    }

    function runAutoBackupNow() {
        const cfg = getAutoBackupCfg();
        const payload = buildBackupPayload();
        downloadJsonFile(payload, `hotel-laundry-autobackup-${dateKey(new Date())}.json`);
        const updated = saveAutoBackupSnapshot(cfg, payload);
        updated.lastRun = dateKey(new Date());
        setAutoBackupCfg(updated);
        showToast('Backup otomatis dijalankan sekarang & tersimpan.', 'success');
        navigateTo('settings');
    }

    function downloadAutoBackupSnapshot(index) {
        const cfg = getAutoBackupCfg();
        const item = (cfg.history || [])[index];
        if (!item) return;
        downloadJsonFile(item.payload, `hotel-laundry-autobackup-${dateKey(item.at)}.json`);
    }

    function handleImportFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                const importedOrders = Array.isArray(data) ? data : data.orders;
                if (!Array.isArray(importedOrders)) throw new Error('invalid');

                pendingImportOrders = importedOrders;
                renderImportConfirmModal(importedOrders.length);
            } catch (err) {
                showToast('File backup tidak valid.', 'warn');
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function renderImportConfirmModal(count) {
        const modal = document.getElementById('modal-container');
        modal.classList.remove('hidden');
        modal.innerHTML = `
            <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden animate-slide-up shadow-2xl">
                <div class="p-6 space-y-4 text-center">
                    <span class="mx-auto w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl"><i class="fa-solid fa-file-import"></i></span>
                    <div>
                        <h3 class="text-base font-extrabold text-slate-800">Impor ${count} Order?</h3>
                        <p class="text-xs text-slate-500 mt-1.5">Pilih cara memasukkan data dari file backup ini.</p>
                    </div>
                    <div class="space-y-2.5 pt-1">
                        <button onclick="applyImport('merge')" class="w-full py-3 rounded-xl bg-slate-800 text-white text-xs font-bold active:scale-95 transition-transform">
                            Gabungkan dengan data saat ini
                        </button>
                        <button onclick="applyImport('replace')" class="w-full py-3 rounded-xl bg-red-50 text-red-600 text-xs font-bold active:scale-95 transition-transform">
                            Timpa (ganti semua data)
                        </button>
                        <button onclick="pendingImportOrders = null; closeModal();" class="w-full py-3 rounded-xl bg-white border border-slate-200 text-slate-500 text-xs font-bold active:scale-95 transition-transform">
                            Batal
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    function applyImport(mode) {
        if (!isAdmin()) { showToast('Hanya admin yang dapat mengimpor data.', 'warn'); return; }
        if (!pendingImportOrders) return;

        if (mode === 'replace') {
            saveOrders(pendingImportOrders);
        } else {
            const current = getOrders();
            const existingIds = new Set(current.map(o => o.id));
            const merged = current.concat(pendingImportOrders.filter(o => !existingIds.has(o.id)));
            saveOrders(merged);
        }

        pendingImportOrders = null;
        closeModal();
        showToast('Data berhasil diimpor.', 'success');
        navigateTo('settings');
    }

    function confirmResetData() {
        if (!isAdmin()) { showToast('Hanya admin yang dapat menghapus semua data.', 'warn'); return; }
        showConfirm(
            'Semua order akan dihapus permanen dan tidak bisa dikembalikan. Pastikan Anda sudah backup data terlebih dahulu.' + (getSyncCfg().url ? ' Karena sinkronisasi aktif, data di semua HP ikut terhapus.' : ''),
            () => {
                saveOrders([]);
                showToast('Semua data order telah dihapus.', 'success');
                navigateTo('home');
            },
            { confirmLabel: 'Ya, Hapus Semua', danger: true }
        );
    }

    function exportMonthlyReportCSV() {
        const report = computeMonthlyReport(reportMonth);
        const header = ['ID Order', 'Tanggal', 'Kamar', 'Nama Tamu', 'Layanan', 'Berat (Kg)', 'Status', 'Total (Rp)'];
        const rows = report.orders.map(o => {
            const { totalPrice } = calculateOrderTotals(o.weightKg, o.service);
            return [
                o.id,
                dateKey(o.createdAt),
                o.room,
                (o.guestName || 'Tamu Kamar ' + o.room),
                o.service,
                formatWeightDisplay(o.weightKg),
                o.status,
                Math.round(totalPrice)
            ];
        });

        // Delimiter ";" agar kolom terbaca rapi di Excel/WPS versi Indonesia
        // (locale ID memakai koma sebagai pemisah desimal, bukan pemisah kolom).
        const csvContent = [header, ...rows]
            .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'))
            .join('\r\n');

        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `data-laundry-${reportMonth}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Data CSV berhasil diunduh.', 'success');
    }

    function exportMonthlyReportHTML() {

        const SERVICE_BADGE = {

        const dayRows = report.dayKeys.map(k => `
            <tr>
                <td>${formatDateLong(k)}</td>

                <td class="num strong">${formatRp(report.byDay[k].rp)}</td>

        const orderRows = [...report.orders]
            .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt))
            .map(o => {

                return `

                <td class="num">${formatWeightDisplay(o.weightKg)} Kg</td>
                <td><span class="badge" style="${STATUS_BADGE[o.status] || STATUS_BADGE.Delivered}">${o.status}</span></td>
                <td class="num strong">${formatRp(totalPrice)}</td>
            </tr>`;
            }).join('');

        const html = `<!DOCTYPE html>
